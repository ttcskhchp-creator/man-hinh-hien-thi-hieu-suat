<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Vận Hành CSKH247 - Cảng Hải Phòng</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#0f172a',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .glass-header {
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- NAVIGATION TOOLBAR (HIỂN THỊ CỐ ĐỊNH RÕ RÀNG, KHÔNG BỊ ẨN KHUẤT) -->
    <header class="glass-header sticky top-0 z-50 px-4 lg:px-6 py-2.5 shadow-2xl">
        <div class="max-w-[1920px] mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
            
            <!-- View Switcher Tabs -->
            <div class="flex flex-wrap items-center gap-1.5 bg-slate-900/90 border border-slate-800 p-1 rounded-xl shadow-inner">
                <button onclick="switchView('day')" id="tab-day" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 bg-blue-600 text-white shadow-md">
                    <i class="fa-solid fa-calendar-day"></i> Hiệu Suất Vận Hành CSKH247 - Ngày
                </button>
                <button onclick="switchView('week')" id="tab-week" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-calendar-week"></i> Hiệu Suất Vận Hành CSKH247 - Tuần/Tháng
                </button>
                
                <!-- Tab Chức năng 3 -->
                <button onclick="switchView('extra1')" id="tab-extra1" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-slate-400 hover:text-white hidden">
                    <i class="fa-solid fa-chart-pie" id="icon-extra1"></i> <span id="label-extra1">Chức Năng 3</span>
                </button>
                <!-- Tab Chức năng 4 -->
                <button onclick="switchView('extra2')" id="tab-extra2" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-slate-400 hover:text-white hidden">
                    <i class="fa-solid fa-chart-line" id="icon-extra2"></i> <span id="label-extra2">Chức Năng 4</span>
                </button>
            </div>

            <!-- Settings / Config Link Button -->
            <div class="flex items-center gap-2">
                <button onclick="openConfigModal()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-medium transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-gear text-amber-400"></i> Cấu Hình Link (6868)
                </button>
            </div>
        </div>
    </header>

    <!-- STATUS BAR & QUICK ACTIONS -->
    <div class="bg-slate-900/40 border-b border-slate-800/60 py-1.5 px-6 text-[11px] text-slate-400 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>OK</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="currentActiveLinkText" class="text-slate-400 truncate max-w-sm">Đang tải URL...</span>
            <a id="openNewTabBtn" href="#" target="_blank" class="px-2 py-0.5 bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/30 rounded text-[10px] transition flex items-center gap-1">
                <i class="fa-solid fa-external-link-alt"></i> Mở tab mới
            </a>
        </div>
    </div>

    <!-- MAIN VIEWER CONTAINER -->
    <main class="flex-1 w-full relative flex flex-col bg-slate-950">
        <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center gap-3 transition-opacity duration-300 pointer-events-none opacity-0" style="display: none;">
            <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-slate-300 font-medium">Đang tải dữ liệu...</p>
        </div>
        
        <!-- IFRAME NGÀY -->
        <iframe id="iframeDay" src="" class="w-full flex-1 border-0 min-h-[calc(100vh-90px)] hidden"></iframe>
        
        <!-- IFRAME TUẦN/THÁNG -->
        <iframe id="iframeWeek" src="" class="w-full flex-1 border-0 min-h-[calc(100vh-90px)] hidden"></iframe>
        
        <!-- IFRAME CHỨC NĂNG 3 -->
        <iframe id="iframeExtra1" src="" class="w-full flex-1 border-0 min-h-[calc(100vh-90px)] hidden"></iframe>
        
        <!-- IFRAME CHỨC NĂNG 4 -->
        <iframe id="iframeExtra2" src="" class="w-full flex-1 border-0 min-h-[calc(100vh-90px)] hidden"></iframe>
    </main>

    <!-- MODAL CẤU HÌNH LINK (MẬT KHẨU 6868) -->
    <div id="configModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-lg rounded-2xl border border-slate-700 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 px-5 py-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-amber-400"></i> Cấu Hình Link Liên Kết (Mật khẩu: 6868)
                </h3>
                <button onclick="closeConfigModal()" class="text-slate-400 hover:text-white transition text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 overflow-y-auto">
                <div id="authSection" class="space-y-3">
                    <p class="text-xs text-slate-400">Vui lòng nhập mật khẩu quản trị để cấu hình đường dẫn:</p>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-1">Mật Khẩu *</label>
                        <input type="password" id="passcodeField" placeholder="Nhập mật khẩu (6868)..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <button onclick="verifyPasscode()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition shadow-lg">Xác Thực</button>
                </div>

                <div id="configFormSection" class="space-y-4 hidden">
                    <p class="text-xs text-emerald-400 font-medium"><i class="fa-solid fa-check-circle mr-1"></i> Xác thực thành công! Bạn có thể chỉnh sửa link:</p>
                    
                    <div class="space-y-3 border-b border-slate-800 pb-3">
                        <h4 class="text-xs font-bold text-blue-400">1. CSKH247 - Ngày</h4>
                        <input type="text" id="inputUrlDay" class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200">
                    </div>

                    <div class="space-y-3 border-b border-slate-800 pb-3">
                        <h4 class="text-xs font-bold text-blue-400">2. CSKH247 - Tuần/Tháng</h4>
                        <input type="text" id="inputUrlWeek" class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200">
                    </div>

                    <div class="space-y-2 border-b border-slate-800 pb-3 bg-slate-900/40 p-3 rounded-xl border border-dashed border-slate-700">
                        <h4 class="text-xs font-bold text-amber-400">3. Chức Năng Bổ Sung 1</h4>
                        <input type="text" id="inputNameExtra1" placeholder="Nhập tên mô tả nút..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200 mb-2">
                        <input type="text" id="inputUrlExtra1" placeholder="Nhập Link URL..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200">
                    </div>

                    <div class="space-y-2 bg-slate-900/40 p-3 rounded-xl border border-dashed border-slate-700">
                        <h4 class="text-xs font-bold text-amber-400">4. Chức Năng Bổ Sung 2</h4>
                        <input type="text" id="inputNameExtra2" placeholder="Nhập tên mô tả nút..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200 mb-2">
                        <input type="text" id="inputUrlExtra2" placeholder="Nhập Link URL..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200">
                    </div>

                    <div class="pt-2 flex justify-end gap-2">
                        <button onclick="closeConfigModal()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl">Hủy</button>
                        <button onclick="saveNewLinks()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl shadow-lg">Lưu & Áp Dụng</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const DEFAULT_URL_DAY = "https://cskh247-daily-chp-dashboard.vercel.app/";
        const DEFAULT_URL_WEEK = "https://cskh-monthly-haiphong-dashboard.vercel.app/";

        window.addEventListener('DOMContentLoaded', () => {
            const savedDay = localStorage.getItem('cskh_url_day') || DEFAULT_URL_DAY;
            const savedWeek = localStorage.getItem('cskh_url_week') || DEFAULT_URL_WEEK;
            const savedExtra1Name = localStorage.getItem('cskh_name_extra1') || '';
            const savedExtra1Url = localStorage.getItem('cskh_url_extra1') || '';
            const savedExtra2Name = localStorage.getItem('cskh_name_extra2') || '';
            const savedExtra2Url = localStorage.getItem('cskh_url_extra2') || '';

            document.getElementById('iframeDay').src = savedDay;
            document.getElementById('iframeWeek').src = savedWeek;

            if (savedExtra1Url && savedExtra1Name) {
                document.getElementById('label-extra1').innerText = savedExtra1Name;
                document.getElementById('iframeExtra1').src = savedExtra1Url;
                document.getElementById('tab-extra1').classList.remove('hidden');
            }

            if (savedExtra2Url && savedExtra2Name) {
                document.getElementById('label-extra2').innerText = savedExtra2Name;
                document.getElementById('iframeExtra2').src = savedExtra2Url;
                document.getElementById('tab-extra2').classList.remove('hidden');
            }

            const lastActiveTab = localStorage.getItem('cskh_active_tab') || 'day';
            switchView(lastActiveTab, false);
        });

        function switchView(mode, saveState = true) {
            const tabs = ['day', 'week', 'extra1', 'extra2'];
            
            const targetIframe = document.getElementById(`iframe${mode.charAt(0).toUpperCase() + mode.slice(1)}`);
            if (!targetIframe || !targetIframe.src) {
                if (mode === 'extra1' || mode === 'extra2') {
                    alert("Chức năng này chưa được cấu hình đường dẫn link!");
                    return;
                }
            }

            if (saveState) {
                showLoading();
                localStorage.setItem('cskh_active_tab', mode);
            }

            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const iframe = document.getElementById(`iframe${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (t === mode) {
                    if (btn) btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 bg-blue-600 text-white shadow-md";
                    if (iframe) {
                        iframe.classList.remove('hidden');
                        updateStatusText(iframe.src);
                    }
                } else {
                    if (btn) btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 text-slate-400 hover:text-white";
                    if (iframe) iframe.classList.add('hidden');
                }
            });
        }

        function showLoading() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';
            overlay.classList.remove('opacity-0');
            overlay.classList.add('opacity-100');

            setTimeout(() => {
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                setTimeout(() => { overlay.style.display = 'none'; }, 300);
            }, 800);
        }

        function updateStatusText(url) {
            document.getElementById('currentActiveLinkText').innerText = `Ấn nút để xem ở cửa sổ mới`;
            document.getElementById('openNewTabBtn').href = url;
        }

        function openConfigModal() {
            document.getElementById('passcodeField').value = '';
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('configFormSection').classList.add('hidden');
            document.getElementById('configModal').classList.remove('hidden');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.add('hidden');
        }

        function verifyPasscode() {
            const pass = document.getElementById('passcodeField').value.trim();
            if (pass === "6868") {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('configFormSection').classList.remove('hidden');
                
                document.getElementById('inputUrlDay').value = document.getElementById('iframeDay').src;
                document.getElementById('inputUrlWeek').value = document.getElementById('iframeWeek').src;
                document.getElementById('inputNameExtra1').value = localStorage.getItem('cskh_name_extra1') || '';
                document.getElementById('inputUrlExtra1').value = localStorage.getItem('cskh_url_extra1') || '';
                document.getElementById('inputNameExtra2').value = localStorage.getItem('cskh_name_extra2') || '';
                document.getElementById('inputUrlExtra2').value = localStorage.getItem('cskh_url_extra2') || '';
            } else {
                alert("Mật khẩu bảo mật không chính xác! Vui lòng thử lại.");
            }
        }

        function saveNewLinks() {
            const newDay = document.getElementById('inputUrlDay').value.trim();
            const newWeek = document.getElementById('inputUrlWeek').value.trim();
            const newName1 = document.getElementById('inputNameExtra1').value.trim();
            const newUrl1 = document.getElementById('inputUrlExtra1').value.trim();
            const newName2 = document.getElementById('inputNameExtra2').value.trim();
            const newUrl2 = document.getElementById('inputUrlExtra2').value.trim();

            if (!newDay || !newWeek) {
                alert("Vui lòng không để trống các đường dẫn chính!");
                return;
            }

            localStorage.setItem('cskh_url_day', newDay);
            localStorage.setItem('cskh_url_week', newWeek);
            localStorage.setItem('cskh_name_extra1', newName1);
            localStorage.setItem('cskh_url_extra1', newUrl1);
            localStorage.setItem('cskh_name_extra2', newName2);
            localStorage.setItem('cskh_url_extra2', newUrl2);

            document.getElementById('iframeDay').src = newDay;
            document.getElementById('iframeWeek').src = newWeek;

            if (newUrl1 && newName1) {
                document.getElementById('label-extra1').innerText = newName1;
                document.getElementById('iframeExtra1').src = newUrl1;
                document.getElementById('tab-extra1').classList.remove('hidden');
            } else {
                document.getElementById('tab-extra1').classList.add('hidden');
            }

            if (newUrl2 && newName2) {
                document.getElementById('label-extra2').innerText = newName2;
                document.getElementById('iframeExtra2').src = newUrl2;
                document.getElementById('tab-extra2').classList.remove('hidden');
            } else {
                document.getElementById('tab-extra2').classList.add('hidden');
            }

            closeConfigModal();
            alert("Đã cập nhật cấu hình thành công!");
        }
    </script>
</body>
</html>
